<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1B1F24">
<title>{% block title %}Riskwatch{% endblock %} · Riskwatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/video-stage.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/depth3d.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>

<a class="skip-link" href="#main">Skip to content</a>
<div class="crit-vignette" id="critVignette" aria-hidden="true"></div>

<header class="console-header">
  <div class="brand">
    <span class="brand-mark" id="pulseDot" aria-hidden="true"></span>
    <span class="brand-name">Riskwatch</span>
  </div>

  <nav class="tabs" aria-label="Primary">
    <a href="/" class="tab {% if active_page == 'live' %}active{% endif %}" {% if active_page == 'live' %}aria-current="page"{% endif %}>Live camera</a>
    <a href="/upload" class="tab {% if active_page == 'upload' %}active{% endif %}" {% if active_page == 'upload' %}aria-current="page"{% endif %}>Upload video</a>
    <a href="/history" class="tab {% if active_page == 'history' %}active{% endif %}" {% if active_page == 'history' %}aria-current="page"{% endif %}>Alert history</a>
    <a href="/analytics" class="tab {% if active_page == 'analytics' %}active{% endif %}" {% if active_page == 'analytics' %}aria-current="page"{% endif %}>Analytics</a>
  </nav>

  <span class="header-spacer"></span>

  <div class="status-chip" id="globalStatusChip" role="status">
    <span class="status-dot" id="globalStatusDot"></span>
    <span id="globalStatusText">Connecting…</span>
    <span class="status-cam" id="globalCameraId"></span>
  </div>

  <button type="button" id="soundToggleBtn" class="status-chip" aria-pressed="false"
          data-tip="Play a tone in this tab when a new alert fires" data-tip-pos="bottom" data-tip-align="end">
    <span class="switch" id="soundToggleIcon" aria-hidden="true"></span>
    <span id="soundToggleText">Sound off</span>
  </button>
</header>

<main class="page" id="main">
  {% block content %}{% endblock %}
</main>

<div id="toastRoot" class="toast-root" aria-live="polite"></div>

<script src="{{ url_for('static', filename='js/common.js') }}"></script>
<script src="{{ url_for('static', filename='js/depth3d.js') }}" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>

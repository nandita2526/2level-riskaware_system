{% extends "base.html" %}
{% block title %}Upload Video{% endblock %}

{% block content %}
<div class="page-head">
  <h1>UPLOAD VIDEO</h1>
  <p>Analyze a recorded clip offline through the same two-level pipeline</p>
</div>

<div class="panel">
  <div class="panel-body">
    <div class="dropzone" id="dropzone">
      <div class="icon">⇩</div>
      <h3>Drop a video here, or click to browse</h3>
      <p>MP4, AVI, MOV, MKV, WEBM</p>
      <input type="file" id="fileInput" accept=".mp4,.avi,.mov,.mkv,.webm" multiple>
    </div>

    <div class="feed-controls" style="padding-left:0;padding-right:0;">
      <input type="text" id="uploadCameraId" placeholder="Camera ID (optional)" style="max-width:220px;">
    </div>

    <div class="job-list" id="jobList"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/upload.js') }}"></script>
{% endblock %}

{% extends "base.html" %}
{% block title %}Alert History{% endblock %}

{% block content %}
<div class="page-head">
  <h1>ALERT HISTORY</h1>
  <p>Every saved incident, AI-verified at Level-2, with snapshot and clip evidence</p>
</div>

<div class="chip-row" id="quickFilters">
  <button class="chip active" data-filter="all" type="button">All</button>
  <button class="chip" data-filter="today" type="button">Today</button>
  <button class="chip" data-filter="critical" type="button">Critical only</button>
</div>

<div class="filter-bar">
  <input type="date" id="filterDate">
  <input type="text" id="filterCamera" placeholder="Camera ID">
  <button class="btn" id="clearFilters">Clear</button>
  <button class="btn" id="refreshHistory" style="margin-left:auto;">Refresh</button>
</div>

<div class="incident-grid" id="incidentGrid">
  <div class="empty-row">Loading incidents…</div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">Incident</h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-media" id="modalMedia"></div>
      <div class="modal-meta" id="modalMeta"></div>
      <div class="modal-actions">
        <button class="btn" id="markFpBtn">Mark False Positive</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/history.js') }}"></script>
{% endblock %}
